version: "2"

# Lean build for single-core Pi Zero (raspberry-pi, armv6) devices.
#
# Differences from the full build on fix-multiroom:
#   - Everything runs on the host network. Plugins reach PulseAudio over
#     tcp:localhost:4317, and with a published port that stream went through
#     balena-engine-proxy, a userspace copy of every sample that cost ~30% CPU
#     on a Zero.
#   - multiroom-server/client use restart: on-failure. Both exit 0 when the mode does
#     not need them, and unless-stopped looped them forever, starving PulseAudio.
#   - The multiroom server is allowed on raspberry-pi and snapcast uses the pcm codec,
#     so a Zero can be master without encoding FLAC.
#   - airplay, hostname and restarter are dropped to save CPU and RAM.

volumes:
  spotifycache:

services:
  audio:
    build: ./core/audio
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    environment:
      # On the host network the default route is the LAN router, not the engine
      # bridge, so the supervisor has to be addressed explicitly.
      SOUND_SUPERVISOR: localhost:80

  sound-supervisor:
    privileged: true
    build:
      context: .
      dockerfile: ./core/sound-supervisor/Dockerfile.template
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.supervisor-api: 1
      io.balena.features.dbus: "1"

  # Multiroom, on the host network like audio so PulseAudio is reachable on
  # localhost. restart: on-failure rather than unless-stopped: both scripts exit 0
  # when the current mode does not need them, and unless-stopped turned that into a
  # restart loop that starved PulseAudio. The sound supervisor still starts them
  # explicitly when the mode changes.
  multiroom-server:
    build: ./core/multiroom/server
    restart: on-failure
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      PULSE_SERVER: tcp:localhost:4317
      SOUND_SUPERVISOR: localhost:80
      # Normally blacklisted on raspberry-pi; this build is tuned for it (pcm codec).
      SOUND_MULTIROOM_ALLOW_SERVER: "1"

  multiroom-client:
    build: ./core/multiroom/client
    restart: on-failure
    network_mode: host
    environment:
      PULSE_SERVER: tcp:localhost:4317
      SOUND_SUPERVISOR: localhost:80

  bluetooth:
    build: ./plugins/bluetooth
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    labels:
      io.balena.features.dbus: 1

  spotify:
    build: ./plugins/spotify
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - spotifycache:/var/cache/raspotify
