version: "2"

# Direct build for single-core Pi Zero (raspberry-pi, armv6) devices, so a Zero
# can be multiroom master or client. Run it with SOUND_MODE=MULTI_ROOM.
#
# Builds on the lean build (branch pi-zero-lean):
#   - Everything runs on the host network. Plugins reach PulseAudio over
#     tcp:localhost:4317, and with a published port that stream went through
#     balena-engine-proxy, a userspace copy of every sample that cost ~30% CPU.
#   - multiroom-server/client use restart: on-failure. Both exit 0 when the mode does
#     not need them, and unless-stopped looped them forever, starving PulseAudio.
#   - airplay, hostname and restarter are dropped to save CPU and RAM.
#
# Direct mode (SOUND_DIRECT) takes PulseAudio out of the multiroom path. The full
# build sends audio through PulseAudio twice (source -> loopback -> snapcast sink ->
# snapserver, then snapclient -> loopback -> DAC), which one core cannot keep up
# with. Here:
#     librespot --pipe--> snapserver --pcm--> snapclient --> PulseAudio --> DAC
#   - librespot writes raw PCM into a FIFO that snapserver reads.
#   - snapclient plays to the hardware sink, and no loopbacks are loaded.
#   - Master election reads snapserver's stream status, not a PulseAudio sink.
#   - Bluetooth is dropped: its audio only reaches PulseAudio, which no longer feeds
#     snapserver. Spotify is the only source on this build.

volumes:
  spotifycache:
  snapfifo:

services:
  audio:
    build: ./core/audio
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    environment:
      # On the host network the default route is the LAN router, not the engine
      # bridge, so the supervisor has to be addressed explicitly.
      SOUND_SUPERVISOR: localhost:80
      SOUND_DIRECT: "1"

  sound-supervisor:
    privileged: true
    build:
      context: .
      dockerfile: ./core/sound-supervisor/Dockerfile.template
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
      SOUND_DIRECT: "1"
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.supervisor-api: 1
      io.balena.features.dbus: "1"

  multiroom-server:
    build: ./core/multiroom/server
    restart: on-failure
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    volumes:
      - snapfifo:/run/snapfifo
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      PULSE_SERVER: tcp:localhost:4317
      SOUND_SUPERVISOR: localhost:80
      # Normally blacklisted on raspberry-pi; direct mode makes it affordable.
      SOUND_MULTIROOM_ALLOW_SERVER: "1"
      SOUND_DIRECT: "1"

  multiroom-client:
    build: ./core/multiroom/client
    restart: on-failure
    network_mode: host
    environment:
      PULSE_SERVER: tcp:localhost:4317
      SOUND_SUPERVISOR: localhost:80
      SOUND_DIRECT: "1"

  spotify:
    build: ./plugins/spotify
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - spotifycache:/var/cache/raspotify
      - snapfifo:/run/snapfifo
    environment:
      SOUND_SPOTIFY_PIPE: /run/snapfifo/spotify
