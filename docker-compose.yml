version: "2"

# Direct build for single-core Pi Zero (raspberry-pi, armv6) devices, so a Zero
# can be multiroom master or client.
#
# Builds on the lean build (branch pi-zero-lean):
#   - Everything runs on the host network. With a published port, PulseAudio
#     traffic went through balena-engine-proxy, a userspace copy of every sample.
#   - multiroom-server/client use restart: on-failure. Both exit 0 when the mode does
#     not need them, and unless-stopped looped them forever.
#   - airplay, hostname and restarter are dropped.
#
# Direct mode (SOUND_DIRECT) keeps PulseAudio out of the audio path entirely:
#     snapserver --runs--> librespot --stdout--> snapserver --pcm--> snapclient --ALSA--> DAC
#   - snapserver launches and owns librespot (process:// source) and reads raw PCM
#     from its stdout. No FIFO between containers, and a librespot restart starts a
#     clean stream instead of misaligning it.
#   - snapclient writes to the card over ALSA; PulseAudio suspends its hardware sink.
#   - Master election reads snapserver's stream status, not a PulseAudio sink.
#   - Spotify is the only source: Bluetooth and the Spotify plugin container are not
#     used. PulseAudio still runs because the sound supervisor connects to it.

volumes:
  spotifycache:

services:
  audio:
    build: ./core/audio
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    environment:
      # On the host network the default route is the LAN router, not the engine
      # bridge, so the supervisor has to be addressed explicitly.
      SOUND_SUPERVISOR: localhost:80
      SOUND_DIRECT: "1"

  sound-supervisor:
    privileged: true
    build:
      context: .
      dockerfile: ./core/sound-supervisor/Dockerfile.template
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
      SOUND_DIRECT: "1"
      # Master or client by election. A device or fleet SOUND_MODE variable overrides this.
      SOUND_MODE: MULTI_ROOM
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.supervisor-api: 1
      io.balena.features.dbus: "1"

  multiroom-server:
    build: ./core/multiroom/server-direct
    restart: on-failure
    network_mode: host
    volumes:
      - spotifycache:/var/cache/raspotify
    environment:
      SOUND_SUPERVISOR: localhost:80

  multiroom-client:
    build: ./core/multiroom/client
    restart: on-failure
    network_mode: host
    privileged: true
    environment:
      PULSE_SERVER: tcp:localhost:4317
      SOUND_SUPERVISOR: localhost:80
      SOUND_DIRECT: "1"
      SOUND_SNAPCLIENT_LOGFILTER: "*:notice"
