version: "2"

# Lean build for single-core Pi Zero (raspberry-pi, armv6) devices running STANDALONE.
#
# Differences from the full build on fix-multiroom:
#   - audio runs on the host network. Every plugin reaches PulseAudio over
#     tcp:localhost:4317, and with a published port that stream went through
#     balena-engine-proxy, a userspace copy of every sample that cost ~30% CPU
#     on a Zero.
#   - multiroom-server/client are dropped. The server is blacklisted on this device
#     type and exits immediately, and in STANDALONE the client exits too. With
#     restart: unless-stopped both looped forever, and each restart rebuilt
#     container networking and starved PulseAudio into dropouts.
#   - airplay, hostname and restarter are dropped to save CPU and RAM.

volumes:
  spotifycache:

services:
  audio:
    build: ./core/audio
    restart: unless-stopped
    privileged: true
    network_mode: host
    labels:
      io.balena.features.dbus: 1
    environment:
      # On the host network the default route is the LAN router, not the engine
      # bridge, so the supervisor has to be addressed explicitly.
      SOUND_SUPERVISOR: localhost:80

  sound-supervisor:
    privileged: true
    build:
      context: .
      dockerfile: ./core/sound-supervisor/Dockerfile.template
    restart: unless-stopped
    network_mode: host
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/mem:/dev/mem"
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/run/dbus/system_bus_socket
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.supervisor-api: 1
      io.balena.features.dbus: "1"

  bluetooth:
    build: ./plugins/bluetooth
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    labels:
      io.balena.features.dbus: 1

  spotify:
    build: ./plugins/spotify
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - spotifycache:/var/cache/raspotify
