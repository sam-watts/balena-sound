# Direct mode (SOUND_DIRECT): librespot writes raw PCM into this FIFO and
# snapserver reads it, so PulseAudio is not in the path at all on the master.
# snapserver creates the FIFO (mode=create); the Spotify plugin waits for it.
[server]
datadir = /var/cache/snapcast/

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /var/www/

[stream]
stream = pipe:///run/snapfifo/spotify?name=balenaSound&mode=create
sampleformat = 44100:16:2
# Raw PCM: no FLAC encode on the master or decode on clients.
codec = pcm

[logging]
filter = *:error
