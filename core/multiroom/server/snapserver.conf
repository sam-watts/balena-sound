[server]
datadir = /var/cache/snapcast/ 

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /var/www/

[stream]
stream = alsa://?name=balenaSound&device=pulse
sampleformat = 44100:16:2
# Raw PCM: no FLAC encode on the master or decode on clients. ~1.4 Mbit/s per client, fine on a LAN.
codec = pcm

[logging]
filter = *:error
